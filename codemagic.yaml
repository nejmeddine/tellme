workflows:
  android-workflow:
    name: BoxMonitor Android Build
    max_build_duration: 60
    environment:
      java: 17
    scripts:
      - name: Set up local.properties
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/local.properties"
      - name: Download Gradle Wrapper JAR
        script: |
          cd $CM_BUILD_DIR
          curl -L "https://services.gradle.org/distributions/gradle-8.0-bin.zip" -o gradle.zip
          unzip -q gradle.zip
          cp gradle-8.0/lib/gradle-wrapper*.jar gradle/wrapper/gradle-wrapper.jar 2>/dev/null || \
          find gradle-8.0 -name "gradle-wrapper.jar" -exec cp {} gradle/wrapper/gradle-wrapper.jar \;
      - name: Build APK debug
        script: |
          cd $CM_BUILD_DIR
          chmod +x gradlew
          ./gradlew assembleDebug
    artifacts:
      - app/build/outputs/**/*.apk
