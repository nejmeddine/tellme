workflows:
  android-workflow:
    name: BoxMonitor Android Build
    max_build_duration: 60
    environment:
      java: 17
    scripts:
      - name: Set up local.properties
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/local.properties"
      - name: Install Gradle
        script: |
          brew install gradle
      - name: Build APK debug
        script: |
          cd $CM_BUILD_DIR
          gradle assembleDebug
    artifacts:
      - app/build/outputs/**/*.apk
